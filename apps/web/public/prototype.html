<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Triplus Commerce OS — 인터랙티브 프로토타입</title>
<style>
/* ============ TOKENS ============ */
:root{
  --bg-0:#060b16; --bg-1:#0a1120; --bg-2:#0e1728; --bg-3:#121d33;
  --panel:#0d1626; --panel-2:#111c30; --panel-3:#16233c;
  --line:#1c2b47; --line-2:#243554; --line-3:#2e4266;
  --tx-0:#eaf1fb; --tx-1:#c3d1e6; --tx-2:#8ba0c0; --tx-3:#61748f;
  --pri:#3b82f6; --pri-2:#60a5fa; --pri-dim:rgba(59,130,246,.14);
  --acc:#34d399; --acc-dim:rgba(52,211,153,.14);
  --warn:#fbbf24; --warn-dim:rgba(251,191,36,.14);
  --dgr:#f87171; --dgr-dim:rgba(248,113,113,.14);
  --vio:#a78bfa; --vio-dim:rgba(167,139,250,.14);
  --pink:#f472b6;
  --r-s:8px; --r-m:12px; --r-l:16px;
  --sh:0 8px 28px rgba(0,0,0,.45);
  --sd-w:212px; --gnb-h:60px;
  --f: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", Roboto, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:
    radial-gradient(1100px 620px at 12% -8%, rgba(59,130,246,.10), transparent 62%),
    radial-gradient(900px 520px at 92% 4%, rgba(167,139,250,.07), transparent 60%),
    var(--bg-0);
  color:var(--tx-0); font-family:var(--f); font-size:13px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#22334f;border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:#2e4468}
::-webkit-scrollbar-track{background:transparent}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none}

/* ============ LAYOUT ============ */
.app{display:flex;flex-direction:column;min-height:100vh}
.gnb{
  height:var(--gnb-h);display:flex;align-items:center;gap:8px;padding:0 20px;
  background:rgba(8,14,26,.86);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:60;
}
.logo{display:flex;align-items:center;gap:9px;margin-right:20px;flex-shrink:0}
.logo-m{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);
  display:grid;place-items:center;box-shadow:0 0 18px rgba(59,130,246,.5)}
.logo-m svg{width:15px;height:15px}
.logo-t{font-size:15px;font-weight:800;letter-spacing:-.3px}
.logo-t b{background:linear-gradient(90deg,#93c5fd,#c4b5fd);-webkit-background-clip:text;background-clip:text;color:transparent}
.gnb-nav{display:flex;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none}
.gnb-nav::-webkit-scrollbar{display:none}
.gnb-i{
  padding:9px 13px;border-radius:9px;color:var(--tx-2);font-weight:600;font-size:13px;
  white-space:nowrap;position:relative;transition:.15s;
}
.gnb-i:hover{color:var(--tx-0);background:rgba(255,255,255,.04)}
.gnb-i.on{color:var(--pri-2);background:var(--pri-dim)}
.gnb-i.on::after{content:"";position:absolute;left:13px;right:13px;bottom:-13px;height:2px;background:var(--pri-2);border-radius:2px}
.gnb-r{display:flex;align-items:center;gap:6px;flex-shrink:0}
.ico-btn{
  width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
  color:var(--tx-2);position:relative;transition:.15s;
}
.ico-btn:hover{background:rgba(255,255,255,.06);color:var(--tx-0)}
.badge-n{position:absolute;top:2px;right:2px;min-width:16px;height:16px;border-radius:8px;
  background:var(--dgr);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px}
.usr{display:flex;align-items:center;gap:8px;padding:5px 9px 5px 5px;border-radius:10px;transition:.15s}
.usr:hover{background:rgba(255,255,255,.06)}
.usr-av{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#2563eb,#7c3aed);
  display:grid;place-items:center;font-size:11px;font-weight:800}
.usr-n{font-size:12px;font-weight:700;line-height:1.25}
.usr-r{font-size:10.5px;color:var(--tx-3)}

.body{display:flex;flex:1;min-height:0}
.sd{
  width:var(--sd-w);flex-shrink:0;border-right:1px solid var(--line);
  background:rgba(9,15,28,.6);padding:16px 12px;display:flex;flex-direction:column;
  position:sticky;top:var(--gnb-h);height:calc(100vh - var(--gnb-h));overflow-y:auto;
}
.sd-g{margin-bottom:16px}
.sd-lb{font-size:10.5px;font-weight:800;color:var(--tx-3);letter-spacing:.6px;padding:0 10px 7px;text-transform:uppercase}
.sd-i{
  display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;
  color:var(--tx-2);font-size:12.5px;font-weight:600;width:100%;text-align:left;transition:.15s;margin-bottom:1px;
}
.sd-i:hover{background:rgba(255,255,255,.05);color:var(--tx-0)}
.sd-i.on{background:linear-gradient(90deg,var(--pri-dim),transparent);color:var(--pri-2);box-shadow:inset 2px 0 0 var(--pri-2)}
.sd-i .ic{width:15px;height:15px;flex-shrink:0;opacity:.9}
.sd-i .cnt{margin-left:auto;font-size:10.5px;font-weight:800;background:var(--panel-3);color:var(--tx-2);
  padding:1px 6px;border-radius:20px}
.sd-i.on .cnt{background:var(--pri);color:#fff}
.copilot-cta{
  margin-top:auto;border:1px solid var(--line-2);border-radius:var(--r-m);padding:12px;
  background:linear-gradient(150deg,rgba(59,130,246,.16),rgba(139,92,246,.10));
  text-align:left;width:100%;position:relative;overflow:hidden;transition:.2s;
}
.copilot-cta:hover{border-color:var(--pri);transform:translateY(-1px)}
.copilot-cta .t{font-size:12px;font-weight:800;color:#bfdbfe;margin-bottom:3px}
.copilot-cta .d{font-size:11px;color:var(--tx-2);line-height:1.45}
.copilot-cta .orb{position:absolute;right:-10px;bottom:-10px;width:52px;height:52px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#60a5fa,#7c3aed);filter:blur(2px);opacity:.55}

.main{flex:1;min-width:0;padding:20px 22px 40px;overflow-x:hidden}
.pg-hd{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.pg-t{font-size:22px;font-weight:800;letter-spacing:-.4px}
.pg-d{font-size:12.5px;color:var(--tx-2);margin-top:4px}
.pg-hd .sp{flex:1}
.pg-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ============ ATOMS ============ */
.btn{
  display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:9px;
  border:1px solid var(--line-2);background:var(--panel-2);color:var(--tx-1);
  font-size:12.5px;font-weight:700;transition:.15s;white-space:nowrap;
}
.btn:hover{border-color:var(--line-3);background:var(--panel-3);color:var(--tx-0)}
.btn.pri{background:linear-gradient(180deg,#3b82f6,#2563eb);border-color:#2563eb;color:#fff;
  box-shadow:0 3px 14px rgba(37,99,235,.4)}
.btn.pri:hover{filter:brightness(1.1)}
.btn.gho{background:transparent}
.btn.sm{padding:5px 10px;font-size:11.5px;border-radius:7px}
.btn.dgr{color:#fca5a5;border-color:rgba(248,113,113,.35)}
.btn.dgr:hover{background:var(--dgr-dim)}
.btn svg{width:14px;height:14px}

.seg{display:flex;background:var(--bg-1);border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px}
.seg button{padding:5px 11px;border-radius:7px;font-size:11.5px;font-weight:700;color:var(--tx-2);transition:.15s}
.seg button:hover{color:var(--tx-0)}
.seg button.on{background:var(--pri);color:#fff;box-shadow:0 2px 8px rgba(59,130,246,.35)}

.card{
  background:linear-gradient(170deg,var(--panel-2),var(--panel));
  border:1px solid var(--line);border-radius:var(--r-l);padding:16px;position:relative;
}
.card-hd{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.card-t{font-size:14px;font-weight:800;letter-spacing:-.2px}
.card-sub{font-size:11.5px;color:var(--tx-3);margin-top:2px}
.card-hd .sp{flex:1}
.link-t{font-size:11.5px;color:var(--tx-2);font-weight:700;display:inline-flex;align-items:center;gap:3px;transition:.15s}
.link-t:hover{color:var(--pri-2)}

.grid{display:grid;gap:14px}
.kpi{
  background:linear-gradient(165deg,var(--panel-2),var(--panel));
  border:1px solid var(--line);border-radius:var(--r-l);padding:14px 15px;cursor:pointer;transition:.18s;position:relative;overflow:hidden;
}
.kpi:hover{border-color:var(--line-3);transform:translateY(-2px);box-shadow:var(--sh)}
.kpi.act{border-color:var(--pri);box-shadow:0 0 0 1px var(--pri-dim),0 10px 26px rgba(37,99,235,.18)}
.kpi-l{font-size:11.5px;color:var(--tx-2);font-weight:700;display:flex;align-items:center;gap:5px}
.kpi-v{font-size:25px;font-weight:800;letter-spacing:-.9px;margin:6px 0 4px;display:flex;align-items:baseline;gap:3px}
.kpi-v small{font-size:13px;font-weight:700;color:var(--tx-1)}
.kpi-f{font-size:11px;color:var(--tx-3);display:flex;align-items:center;gap:5px}
.up{color:var(--acc);font-weight:800}
.down{color:var(--dgr);font-weight:800}
.kpi-spark{position:absolute;right:12px;bottom:10px;opacity:.85}

.chip{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;
  font-size:11px;font-weight:800;border:1px solid transparent;white-space:nowrap;
}
.c-blue{background:var(--pri-dim);color:#93c5fd;border-color:rgba(59,130,246,.28)}
.c-green{background:var(--acc-dim);color:#6ee7b7;border-color:rgba(52,211,153,.28)}
.c-warn{background:var(--warn-dim);color:#fcd34d;border-color:rgba(251,191,36,.28)}
.c-dgr{background:var(--dgr-dim);color:#fca5a5;border-color:rgba(248,113,113,.28)}
.c-vio{background:var(--vio-dim);color:#c4b5fd;border-color:rgba(167,139,250,.28)}
.c-gray{background:rgba(255,255,255,.05);color:var(--tx-2);border-color:var(--line-2)}

.tb-wrap{overflow-x:auto;margin:0 -4px;padding:0 4px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
thead th{
  text-align:left;font-size:11px;font-weight:800;color:var(--tx-3);padding:8px 10px;
  border-bottom:1px solid var(--line);white-space:nowrap;user-select:none;
}
thead th.srt{cursor:pointer;transition:.15s}
thead th.srt:hover{color:var(--tx-0)}
thead th .ar{opacity:0;margin-left:3px;font-size:9px}
thead th.act-srt{color:var(--pri-2)}
thead th.act-srt .ar{opacity:1}
tbody td{padding:10px;border-bottom:1px solid rgba(28,43,71,.55);vertical-align:middle}
tbody tr{transition:.12s}
tbody tr.clk{cursor:pointer}
tbody tr.clk:hover{background:rgba(59,130,246,.07)}
tbody tr.sel{background:rgba(59,130,246,.12);box-shadow:inset 2px 0 0 var(--pri)}
.num{font-variant-numeric:tabular-nums}
.right{text-align:right}

.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;
  color:#fff;flex-shrink:0;border:1.5px solid rgba(255,255,255,.14)}
.av.sm{width:24px;height:24px;font-size:10px}
.av.lg{width:52px;height:52px;font-size:18px}
.cr-cell{display:flex;align-items:center;gap:9px;min-width:0}
.cr-n{font-weight:700;display:flex;align-items:center;gap:4px}
.cr-c{font-size:11px;color:var(--tx-3)}
.vf{width:12px;height:12px;flex-shrink:0}

.bar-t{height:5px;border-radius:4px;background:rgba(255,255,255,.07);overflow:hidden;min-width:52px}
.bar-f{height:100%;border-radius:4px;background:linear-gradient(90deg,#3b82f6,#60a5fa);transition:width .5s cubic-bezier(.4,0,.2,1)}
.bar-f.g{background:linear-gradient(90deg,#10b981,#34d399)}
.bar-f.w{background:linear-gradient(90deg,#f59e0b,#fbbf24)}

.pill-tabs{display:flex;gap:6px;flex-wrap:wrap}
.pill{padding:6px 12px;border-radius:20px;font-size:11.5px;font-weight:700;color:var(--tx-2);
  border:1px solid var(--line);background:var(--bg-1);transition:.15s}
.pill:hover{color:var(--tx-0);border-color:var(--line-3)}
.pill.on{background:var(--pri);border-color:var(--pri);color:#fff}
.pill .n{opacity:.75;margin-left:3px}

.inp{
  background:var(--bg-1);border:1px solid var(--line-2);border-radius:9px;padding:8px 11px;
  color:var(--tx-0);font-size:12.5px;width:100%;transition:.15s;
}
.inp:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-dim)}
.inp::placeholder{color:var(--tx-3)}
select.inp{cursor:pointer;appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238ba0c0' stroke-width='2.5'><path d='M6 9l6 6 6-6'/></svg>");
  background-repeat:no-repeat;background-position:right 9px center;background-size:14px;padding-right:28px}
.fld-l{font-size:11px;font-weight:800;color:var(--tx-2);margin-bottom:6px;display:flex;align-items:center;gap:4px}
.chk{display:flex;align-items:center;gap:7px;padding:5px 0;cursor:pointer;font-size:12px;color:var(--tx-1);font-weight:600}
.chk input{width:15px;height:15px;accent-color:var(--pri);cursor:pointer}
.chk:hover{color:var(--tx-0)}

.srch{position:relative}
.srch svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--tx-3)}
.srch .inp{padding-left:31px}

.rng{width:100%;accent-color:var(--pri);cursor:pointer;height:4px}

.empty{padding:44px 20px;text-align:center;color:var(--tx-3)}
.empty svg{width:38px;height:38px;opacity:.45;margin-bottom:10px}
.empty .t{font-size:13px;font-weight:700;color:var(--tx-2);margin-bottom:4px}

/* ============ OVERLAYS ============ */
.ovl{position:fixed;inset:0;background:rgba(3,6,14,.72);backdrop-filter:blur(4px);z-index:200;
  display:none;align-items:center;justify-content:center;padding:24px}
.ovl.on{display:flex;animation:fade .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{
  background:linear-gradient(170deg,#111c30,#0b1322);border:1px solid var(--line-2);
  border-radius:18px;box-shadow:0 24px 70px rgba(0,0,0,.6);max-width:min(920px,100%);width:100%;
  max-height:88vh;display:flex;flex-direction:column;animation:pop .22s cubic-bezier(.2,.8,.3,1);
}
.modal.sm{max-width:460px}
.modal.md{max-width:640px}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.modal-hd{display:flex;align-items:flex-start;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}
.modal-hd .t{font-size:16px;font-weight:800}
.modal-hd .d{font-size:12px;color:var(--tx-2);margin-top:3px}
.modal-bd{padding:18px 20px;overflow-y:auto;flex:1}
.modal-ft{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;align-items:center}
.x-btn{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--tx-2);flex-shrink:0}
.x-btn:hover{background:rgba(255,255,255,.07);color:var(--tx-0)}

.drw{
  position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);z-index:210;
  background:linear-gradient(180deg,#0e1728,#0a1120);border-left:1px solid var(--line-2);
  box-shadow:-16px 0 50px rgba(0,0,0,.5);transform:translateX(102%);transition:transform .28s cubic-bezier(.3,.9,.3,1);
  display:flex;flex-direction:column;
}
.drw.on{transform:none}
.drw-hd{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.drw-bd{flex:1;overflow-y:auto;padding:16px 18px}
.drw-ft{padding:12px 16px;border-top:1px solid var(--line)}

.toast-wrap{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{
  display:flex;align-items:center;gap:9px;padding:10px 15px;border-radius:11px;
  background:rgba(18,29,51,.97);border:1px solid var(--line-3);box-shadow:var(--sh);
  font-size:12.5px;font-weight:700;animation:tin .25s cubic-bezier(.2,.8,.3,1);
}
@keyframes tin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.toast.out{animation:tout .25s forwards}
@keyframes tout{to{opacity:0;transform:translateY(10px)}}
.toast svg{width:15px;height:15px;flex-shrink:0}
.toast.ok svg{color:var(--acc)} .toast.info svg{color:var(--pri-2)} .toast.warn svg{color:var(--warn)}

.tip{position:fixed;z-index:400;background:rgba(10,17,32,.97);border:1px solid var(--line-3);
  border-radius:9px;padding:8px 11px;font-size:11.5px;pointer-events:none;box-shadow:var(--sh);display:none;white-space:nowrap}
.tip.on{display:block}
.tip .tt{font-weight:800;margin-bottom:3px;font-size:11px;color:var(--tx-2)}
.tip .tv{font-weight:800;font-size:13px}

/* ============ MISC BLOCKS ============ */
.stepper{display:flex;align-items:center;flex:1;min-width:300px}
.stp{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;flex-shrink:0;cursor:pointer}
.stp-dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;
  border:2px solid var(--line-3);background:var(--bg-1);color:var(--tx-3);transition:.2s}
.stp.done .stp-dot{background:var(--pri);border-color:var(--pri);color:#fff}
.stp.now .stp-dot{border-color:var(--pri-2);color:var(--pri-2);box-shadow:0 0 0 4px var(--pri-dim)}
.stp-l{font-size:11.5px;font-weight:700;color:var(--tx-3);white-space:nowrap}
.stp.done .stp-l,.stp.now .stp-l{color:var(--tx-0)}
.stp-s{font-size:10px;color:var(--tx-3)}
.stp-line{flex:1;height:2px;background:var(--line-2);margin:0 6px;margin-bottom:26px;border-radius:2px}
.stp-line.done{background:var(--pri)}

.kanban{display:grid;grid-template-columns:repeat(4,minmax(200px,1fr));gap:12px;align-items:start}
.kb-col{background:rgba(10,17,32,.5);border:1px solid var(--line);border-radius:var(--r-m);padding:10px;min-height:150px;transition:.15s}
.kb-col.over{border-color:var(--pri);background:rgba(59,130,246,.07)}
.kb-hd{display:flex;align-items:center;gap:7px;padding:2px 4px 10px;font-size:12px;font-weight:800}
.kb-hd .dot{width:7px;height:7px;border-radius:50%}
.kb-hd .n{margin-left:auto;font-size:10.5px;color:var(--tx-3);background:var(--panel-3);padding:1px 7px;border-radius:20px}
.kb-card{background:linear-gradient(165deg,var(--panel-2),var(--panel));border:1px solid var(--line-2);
  border-radius:10px;padding:11px;margin-bottom:8px;cursor:grab;transition:.15s}
.kb-card:hover{border-color:var(--line-3);transform:translateY(-1px)}
.kb-card.drag{opacity:.4}
.kb-card .t{font-size:12.5px;font-weight:700;margin-bottom:6px;line-height:1.35}
.kb-card .m{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--tx-3);flex-wrap:wrap}

.flow{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center}
.flow-box{border:1px solid var(--line-2);border-radius:var(--r-m);padding:12px;background:rgba(10,17,32,.5)}
.flow-box .h{font-size:11px;font-weight:800;color:var(--tx-2);margin-bottom:9px}
.flow-r{display:flex;align-items:center;gap:9px;padding:7px;border-radius:9px;transition:.15s;cursor:pointer}
.flow-r:hover{background:rgba(255,255,255,.05)}
.flow-ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex-shrink:0}
.flow-r .t{font-size:12px;font-weight:700}
.flow-r .s{font-size:10.5px;color:var(--tx-3)}

.wheel{position:relative;width:250px;height:250px;margin:0 auto}
.wheel-c{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:88px;height:88px;border-radius:50%;

  border:1px solid rgba(96,165,250,.4);display:grid;place-items:center;text-align:center;font-size:11.5px;font-weight:800;line-height:1.3}
.wheel-n{position:absolute;width:66px;height:66px;border-radius:50%;background:rgba(14,23,40,.95);
  border:1px solid var(--line-3);display:grid;place-items:center;text-align:center;cursor:pointer;transition:.2s}
.wheel-n:hover,.wheel-n.on{border-color:var(--pri-2);box-shadow:0 0 0 4px var(--pri-dim);transform:scale(1.06)}
.wheel-n .t{font-size:11px;font-weight:800}
.wheel-n .s{font-size:9px;color:var(--tx-3)}

.ins-row{display:flex;align-items:flex-start;gap:9px;padding:10px;border-radius:10px;border:1px solid var(--line);

.ins-row:hover{border-color:var(--line-3);background:rgba(59,130,246,.06)}
.ins-ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex-shrink:0}
.ins-row .t{font-size:12px;font-weight:600;line-height:1.45}

.note{border-left:3px solid var(--pri);background:rgba(59,130,246,.07);border-radius:0 10px 10px 0;padding:10px 12px}
.note.new{border-left-color:var(--acc);background:rgba(52,211,153,.07)}
.note .h{font-size:11px;font-weight:800;color:var(--pri-2);margin-bottom:4px;display:flex;align-items:center;gap:5px}
.note.new .h{color:var(--acc)}
.note .b{font-size:11.5px;color:var(--tx-1);line-height:1.55}

.mini-t{display:flex;flex-direction:column;gap:7px}
.mini-r{display:flex;align-items:center;gap:9px;font-size:12px}
.mini-r .lb{width:74px;flex-shrink:0;display:flex;align-items:center;gap:5px;font-weight:600}
.mini-r .vv{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums}

.dot-l{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--tx-2);font-weight:600}
.legend span{display:flex;align-items:center;gap:5px}

.pager{display:flex;align-items:center;justify-content:center;gap:4px;padding:14px 0 2px}
.pg-b{min-width:29px;height:29px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:700;
  color:var(--tx-2);border:1px solid transparent;transition:.15s;padding:0 7px}
.pg-b:hover{background:rgba(255,255,255,.06);color:var(--tx-0)}
.pg-b.on{background:var(--pri);color:#fff}
.pg-b:disabled{opacity:.3;cursor:not-allowed}

.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-h{text-align:center;font-size:10px;font-weight:800;color:var(--tx-3);padding:4px 0}
.cal-d{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  border-radius:7px;font-size:11.5px;font-weight:600;color:var(--tx-1);cursor:pointer;transition:.15s;position:relative}
.cal-d:hover{background:rgba(255,255,255,.07)}
.cal-d.mute{color:var(--tx-3);opacity:.4}
.cal-d.on{background:var(--pri);color:#fff}
.cal-d.rng{background:var(--pri-dim);color:#bfdbfe;border-radius:0}
.cal-d .evs{display:flex;gap:2px;position:absolute;bottom:4px}
.cal-d .ev{width:4px;height:4px;border-radius:50%}

.tl{position:relative;padding-left:20px}
.tl::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line-2)}
.tl-i{position:relative;padding-bottom:14px}
.tl-i::before{content:"";position:absolute;left:-19px;top:4px;width:10px;height:10px;border-radius:50%;
  background:var(--bg-1);border:2px solid var(--line-3)}
.tl-i.done::before{background:var(--acc);border-color:var(--acc)}
.tl-i.now::before{background:var(--pri);border-color:var(--pri);box-shadow:0 0 0 4px var(--pri-dim)}
.tl-i .t{font-size:12.5px;font-weight:700}
.tl-i .s{font-size:11px;color:var(--tx-3);margin-top:2px}

.msg.me{flex-direction:row-reverse}
.msg-b{max-width:80%;padding:10px 12px;border-radius:12px;font-size:12.5px;line-height:1.55;

.msg.me .msg-b{background:linear-gradient(180deg,#2563eb,#1d4ed8);border-color:#2563eb;color:#fff}
.msg-av{width:26px;height:26px;border-radius:8px;flex-shrink:0;display:grid;place-items:center;

.sug{padding:6px 10px;border-radius:18px;font-size:11.5px;font-weight:700;border:1px solid var(--line-2);

.typing{display:inline-flex;gap:3px;align-items:center;padding:2px}
.typing i{width:5px;height:5px;border-radius:50%;background:var(--tx-2);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s} .typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}

.notif-i{display:flex;gap:10px;padding:11px;border-radius:10px;transition:.15s;cursor:pointer;border:1px solid transparent}
.notif-i:hover{background:rgba(255,255,255,.05);border-color:var(--line)}
.notif-i.unread{background:rgba(59,130,246,.06);border-color:rgba(59,130,246,.18)}
.notif-i .t{font-size:12px;font-weight:600;line-height:1.45}
.notif-i .tm{font-size:10.5px;color:var(--tx-3);margin-top:3px}

.tabs-u{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tab-u{padding:9px 14px;font-size:12.5px;font-weight:700;color:var(--tx-2);white-space:nowrap;

.tab-u:hover{color:var(--tx-0)}
.tab-u.on{color:var(--pri-2);border-bottom-color:var(--pri-2)}

.scr{display:none}
.scr.on{display:block;animation:sin .22s ease}
@keyframes sin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.gs{background:linear-gradient(90deg,#93c5fd,#c4b5fd);-webkit-background-clip:text;background-clip:text;color:transparent}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px}
.hint{position:relative}
.hint::after{
  content:attr(data-hint);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);

.hint:hover::after{opacity:1}

.demo-fab{

<script>
/* =========================================================================
   [2] CHART KIT — inline SVG, dark surface #0d1626
   팔레트는 dataviz validator(OKLCH 밴드/채도/CVD/대비) 통과값 사용
   ========================================================================= */
const SER=['#3b82f6','#0fa373','#a855f7','#c28610','#ec4899','#0891b2']; // categorical, 고정 순서
const SER_INK=['#93c5fd','#6ee7b7','#c4b5fd','#fcd34d','#f9a8d4','#67e8f9']; // 텍스트/레전드용 밝은 잉크
const GRID='rgba(255,255,255,.07)', AXIS='#61748f';

const TIP=$('#tip');
function tipShow(e,html){TIP.innerHTML=html;TIP.classList.add('on');
  const r=TIP.getBoundingClientRect();let x=e.clientX+14,y=e.clientY-r.height-10;
  if(x+r.width>innerWidth-8)x=e.clientX-r.width-14; if(y<8)y=e.clientY+16;
  TIP.style.left=x+'px';TIP.style.top=y+'px';}
function tipHide(){TIP.classList.remove('on');}
function bindTip(root){
  $$('[data-tip]',root).forEach(n=>{
    n.addEventListener('mousemove',e=>tipShow(e,n.dataset.tip));
    n.addEventListener('mouseleave',tipHide);
  });
}

/* ---- sparkline: 단일 시리즈, 레전드 없음 ---- */
function sparkline(vals,{w=88,h=30,color='#60a5fa',fill=true}={}){
  const mn=Math.min(...vals),mx=Math.max(...vals),rg=(mx-mn)||1;
  const pts=vals.map((v,i)=>[i/(vals.length-1)*w,h-2-((v-mn)/rg)*(h-6)]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const id='sg'+Math.random().toString(36).slice(2,7);
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">
    ${fill?`<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${color}" stop-opacity=".34"/><stop offset="1" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs><path d="${d} L ${w} ${h} L 0 ${h} Z" fill="url(#${id})"/>`:''}
    <path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${pts.at(-1)[0].toFixed(1)}" cy="${pts.at(-1)[1].toFixed(1)}" r="2.6" fill="${color}"/>
  </svg>`;
}

/* ---- 세로 막대: 단일 측정치, 호버 툴팁 + 선택적 직접 라벨 ---- */
function barChart(data,{h=190,fmt=wonM,label='매출',color=SER[0]}={}){
  const mx=Math.max(...data.map(d=>d.v))*1.16||1;
  const bw=100/data.length;
  return `<div style="position:relative">
    <div style="display:flex;align-items:flex-end;gap:2px;height:${h}px;padding-top:22px">
    ${data.map((d,i)=>{
      const pctH=(d.v/mx)*100;
      return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0"
        data-tip="<div class='tt'>${d.k}</div><div class='tv'>${fmt(d.v)}</div>${d.sub?`<div style='color:#8ba0c0;font-size:11px;margin-top:2px'>${d.sub}</div>`:''}">
        <div style="font-size:10px;font-weight:800;color:${i===0?'#eaf1fb':'#8ba0c0'};margin-bottom:4px;white-space:nowrap">${fmt(d.v)}</div>
        <div style="width:100%;max-width:46px;height:${pctH}%;background:linear-gradient(180deg,${color},${color}aa);
          border-radius:4px 4px 0 0;transition:height .6s cubic-bezier(.4,0,.2,1);min-height:3px;cursor:pointer"></div>
      </div>`;}).join('')}
    </div>
    <div style="display:flex;gap:2px;border-top:1px solid ${GRID};padding-top:7px">
      ${data.map(d=>`<div style="flex:1;text-align:center;font-size:10px;color:${AXIS};line-height:1.25;min-width:0;word-break:keep-all">${d.k}</div>`).join('')}
    </div></div>`;
}

/* ---- 가로 막대 랭킹 ---- */
function hbar(data,{fmt=v=>v.toFixed(2)+'%',color=SER[0],showImg=false}={}){
  const mx=Math.max(...data.map(d=>d.v))||1;
  return `<div style="display:flex;flex-direction:column;gap:9px">
  ${data.map((d,i)=>`<div style="display:flex;align-items:center;gap:9px"
      data-tip="<div class='tt'>${d.k}</div><div class='tv'>${fmt(d.v)}</div>${d.sub?`<div style='color:#8ba0c0;font-size:11px;margin-top:2px'>${d.sub}</div>`:''}">
    ${showImg?`<span class="av sm" style="background:${d.color||avColor(d.k)}">${d.k[0]}</span>`:''}
    <span style="flex:1;min-width:0;font-size:11.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${d.k}</span>
    <span style="width:96px;height:7px;border-radius:4px;background:rgba(255,255,255,.06);overflow:hidden;flex-shrink:0">
      <span style="display:block;height:100%;width:${(d.v/mx*100).toFixed(1)}%;background:${color};border-radius:4px;transition:width .6s"></span>
    </span>
    <span class="num" style="width:52px;text-align:right;font-size:11.5px;font-weight:800;flex-shrink:0">${fmt(d.v)}</span>
  </div>`).join('')}</div>`;
}

/* ---- 도넛(구성비) : 레전드 + 직접 라벨, 세그먼트 사이 2px 서피스 갭 ---- */
function donut(data,{size=132,thick=15,center=''}={}){
  const tot=data.reduce((a,b)=>a+b.v,0)||1, r=(size-thick)/2, C=2*Math.PI*r, gap=2;
  let off=0;
  const arcs=data.map((d,i)=>{
    const len=(d.v/tot)*C, seg=Math.max(0,len-gap);
    const s=`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${d.c||SER[i%6]}"
      stroke-width="${thick}" stroke-dasharray="${seg} ${C-seg}" stroke-dashoffset="${-off}"
      transform="rotate(-90 ${size/2} ${size/2})" stroke-linecap="butt" style="cursor:pointer"
      data-tip="<div class='tt'>${d.k}</div><div class='tv'>${(d.v/tot*100).toFixed(1)}%</div><div style='color:#8ba0c0;font-size:11px'>${d.lbl||''}</div>"/>`;
    off+=len; return s;}).join('');
  return `<div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
    <div style="position:relative;width:${size}px;height:${size}px;flex-shrink:0">
      <svg width="${size}" height="${size}">${arcs}</svg>
      ${center?`<div style="position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.25">${center}</div>`:''}
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;flex:1;min-width:118px">
    ${data.map((d,i)=>`<div style="display:flex;align-items:center;gap:7px;font-size:11.5px">
      <span class="dot-l" style="background:${d.c||SER[i%6]}"></span>
      <span style="flex:1;color:var(--tx-1);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${d.k}</span>
      <span class="num" style="font-weight:800">${(d.v/tot*100).toFixed(1)}%</span>
    </div>`).join('')}</div></div>`;
}

/* ---- 라인/영역 (단일 측정치 · 크로스헤어 툴팁) ---- */
function lineChart(pts,{h=170,color=SER[0],fmt=wonM,xlab=[],ylab=true,area=true,id=null}={}){
  const W=560,H=h,PL=ylab?46:6,PR=8,PT=12,PB=22;
  const vals=pts.map(p=>p.v), mx=Math.max(...vals)*1.1||1, mn=0;
  const X=i=>PL+(i/(pts.length-1||1))*(W-PL-PR);
  const Y=v=>PT+(1-(v-mn)/(mx-mn))*(H-PT-PB);
  const d=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.v).toFixed(1)).join(' ');
  const gid='lg'+Math.random().toString(36).slice(2,7);
  const ticks=[0,.25,.5,.75,1].map(t=>mn+(mx-mn)*t);
  const cid=id||('lc'+Math.random().toString(36).slice(2,7));
  return `<div style="position:relative" id="${cid}">
  <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${h}px;overflow:visible" preserveAspectRatio="none">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${color}" stop-opacity=".30"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    ${ticks.map(t=>`<line x1="${PL}" y1="${Y(t)}" x2="${W-PR}" y2="${Y(t)}" stroke="${GRID}" stroke-width="1" vector-effect="non-scaling-stroke"/>`).join('')}
    ${area?`<path d="${d} L ${X(pts.length-1)} ${Y(mn)} L ${X(0)} ${Y(mn)} Z" fill="url(#${gid})"/>`:''}
    <path d="${d}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>
    <line class="ch-cross" x1="0" y1="${PT}" x2="0" y2="${H-PB}" stroke="${color}" stroke-width="1" stroke-dasharray="3 3" opacity="0" vector-effect="non-scaling-stroke"/>
    <circle class="ch-dot" r="4" fill="${color}" stroke="#0d1626" stroke-width="2" opacity="0"/>
  </svg>
  ${ylab?`<div style="position:absolute;left:0;top:0;height:${h}px;width:${PL-6}px;pointer-events:none">
    ${ticks.map(t=>`<div style="position:absolute;right:0;top:${(Y(t)/H*h-6).toFixed(1)}px;font-size:9.5px;color:${AXIS};font-variant-numeric:tabular-nums">${fmt(t)}</div>`).join('')}
  </div>`:''}
  ${xlab.length?`<div style="display:flex;justify-content:space-between;padding:5px ${PR}px 0 ${PL}px;font-size:9.5px;color:${AXIS}">
    ${xlab.map(l=>`<span>${l}</span>`).join('')}</div>`:''}
  <div class="ch-hit" style="position:absolute;left:${PL/W*100}%;right:${PR/W*100}%;top:0;height:${h}px;cursor:crosshair"></div>
  <script type="application/json" class="ch-data">${JSON.stringify({pts,mx,PL,PR,PT,PB,W,H,h})}<\/script>
  </div>`;
}
function bindLine(rootId,fmt=wonM,label='매출'){
  const root=$('#'+rootId); if(!root)return;
  const meta=JSON.parse($('.ch-data',root).textContent);
  const hit=$('.ch-hit',root),cross=$('.ch-cross',root),dot=$('.ch-dot',root);
  const {pts,mx,PL,PR,PT,PB,W,H}=meta;
  hit.addEventListener('mousemove',e=>{
    const r=hit.getBoundingClientRect();
    const t=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));
    const i=Math.round(t*(pts.length-1)); const p=pts[i];
    const x=PL+(i/(pts.length-1||1))*(W-PL-PR), y=PT+(1-p.v/mx)*(H-PT-PB);
    cross.setAttribute('x1',x);cross.setAttribute('x2',x);cross.setAttribute('opacity','.6');
    dot.setAttribute('cx',x);dot.setAttribute('cy',y);dot.setAttribute('opacity','1');
    tipShow(e,`<div class='tt'>${p.k}</div><div class='tv'>${fmt(p.v)}</div><div style='color:#8ba0c0;font-size:11px;margin-top:2px'>${label}</div>`);
  });
  hit.addEventListener('mouseleave',()=>{cross.setAttribute('opacity','0');dot.setAttribute('opacity','0');tipHide();});
}

/* ---- 게이지 링 ---- */
function ring(v,{size=104,thick=11,color=SER[0],label='',sub=''}={}){
  const r=(size-thick)/2,C=2*Math.PI*r,len=C*Math.min(1,v/100);
  return `<div style="position:relative;width:${size}px;height:${size}px;flex-shrink:0">
    <svg width="${size}" height="${size}">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="${thick}"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${thick}"
        stroke-dasharray="${len} ${C-len}" stroke-linecap="round" transform="rotate(-90 ${size/2} ${size/2})"
        style="transition:stroke-dasharray .8s cubic-bezier(.4,0,.2,1)"/>
    </svg>
    <div style="position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.2">
      <div><div style="font-size:19px;font-weight:800">${label||v+'%'}</div>
      <div style="font-size:10px;color:var(--tx-3);font-weight:700">${sub}</div></div>
    </div></div>`;
}

/* ---- 레이더(단일 시리즈) ---- */
function radar(items,{size=168}={}){
  const n=items.length,cx=size/2,cy=size/2,R=size/2-30;
  const pt=(i,f)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [cx+Math.cos(a)*R*f,cy+Math.sin(a)*R*f];};
  const grid=[.25,.5,.75,1].map(f=>`<polygon points="${items.map((_,i)=>pt(i,f).map(v=>v.toFixed(1)).join(',')).join(' ')}"
    fill="none" stroke="${GRID}" stroke-width="1"/>`).join('');
  const poly=items.map((it,i)=>pt(i,it.v/100).map(v=>v.toFixed(1)).join(',')).join(' ');
  return `<svg width="${size}" height="${size}" style="overflow:visible">${grid}
    ${items.map((_,i)=>{const[x,y]=pt(i,1);return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="${GRID}"/>`;}).join('')}
    <polygon points="${poly}" fill="${SER[0]}44" stroke="${SER[0]}" stroke-width="2" stroke-linejoin="round"/>
    ${items.map((it,i)=>{const[x,y]=pt(i,it.v/100);return `<circle cx="${x}" cy="${y}" r="3.2" fill="${SER[0]}"
      data-tip="<div class='tt'>${it.k}</div><div class='tv'>${it.v}%</div>" style="cursor:pointer"/>`;}).join('')}
    ${items.map((it,i)=>{const[x,y]=pt(i,1.30);return `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle"
      font-size="9.5" fill="${AXIS}" font-weight="700">${it.k}</text>`;}).join('')}
  </svg>`;
}

/* ---- 히트맵(코호트) : 단일 색상 순차 램프 ---- */
function heatmap(rows,cols){
  const ramp=v=>{ if(v==null) return 'rgba(255,255,255,.03)';
    const t=Math.min(1,v/60); return `rgba(59,130,246,${(0.08+t*0.85).toFixed(2)})`; };
  return `<div class="tb-wrap"><table style="font-size:11.5px">
    <thead><tr><th>코호트</th><th class="right">규모</th>
      ${cols.map(c=>`<th class="right">${c}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r=>`<tr><td style="font-weight:700">${r.m}</td>
      <td class="right num" style="color:var(--tx-2)">${r.size.toLocaleString()}</td>
      ${r.d.map((v,i)=>`<td class="right" style="padding:4px">
        <div data-tip="<div class='tt'>${r.m} · ${cols[i]}</div><div class='tv'>${v==null?'-':v+'%'}</div>"
          style="background:${ramp(v)};border-radius:6px;padding:6px 8px;font-weight:800;font-variant-numeric:tabular-nums;
          color:${v!=null&&v>40?'#fff':'var(--tx-1)'};cursor:pointer">${v==null?'–':v+'%'}</div></td>`).join('')}
    </tr>`).join('')}</tbody></table></div>`;
}
</script>

function toast(msg,kind='ok'){
  const icons={ok:'check',info:'bolt',warn:'alert'};
  const t=el(`<div class="toast ${kind}">${ic(icons[kind]||'check',15)}<span>${msg}</span></div>`);
  $('#toasts').appendChild(t);
  setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),260);},2600);
}

function stepperHtml(cur,labels,subs,route){
  return labels.map((l,i)=>{
    const st=i<cur?'done':i===cur?'now':'';
    return (i?`<div class="stp-line ${i<=cur?'done':''}"></div>`:'')+
    `<div class="stp ${st}" ${route?`data-go="${route}"`:''}>
      <div class="stp-dot">${i<cur?'✓':i+1}</div>
      <div class="stp-l">${l}</div><div class="stp-s">${subs[i]}</div></div>`;
  }).join('');
}
function worldMap(){
  const dots=[[18,42],[24,38],[30,46],[46,34],[48,40],[52,44],[58,36],[62,42],[66,48],[70,40],[74,44],[78,52],
    [82,46],[76,58],[70,56],[64,60],[34,56],[28,60],[42,62],[86,60],[20,52],[54,52],[60,50],[44,48],[38,44],[50,58]];
  const hot=[[78,44,'KR'],[22,42,'US'],[82,47,'JP'],[52,36,'DE'],[48,38,'FR'],[73,55,'SEA']];
  return `<div style="position:relative;height:132px;border-radius:10px;background:rgba(255,255,255,.02);overflow:hidden;border:1px solid var(--line)">
    <svg viewBox="0 0 100 70" style="width:100%;height:100%">
      ${Array.from({length:190},(_,i)=>{const x=(i*7.3)%96+2,y=((i*11.7)%54)+8;
        return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r=".55" fill="#25375a"/>`;}).join('')}
      ${dots.map(([x,y])=>`<circle cx="${x}" cy="${y}" r=".9" fill="#31456b"/>`).join('')}
      ${hot.map(([x,y,c],i)=>`<g data-tip="<div class='tt'>${c}</div><div class='tv'>운영 중</div>" style="cursor:pointer">
        <circle cx="${x}" cy="${y}" r="4.2" fill="${SER[i%6]}" opacity=".16"/>
        <circle cx="${x}" cy="${y}" r="1.8" fill="${SER[i%6]}"/></g>`).join('')}
    </svg></div>`;
}

const TIERS=[['t10','10만 이상',100000],['t50','50만 이상',500000],['t100','100만 이상',1000000],['t500','500만 이상',5000000]];
const SORTS={fit:'적합도',followers:'팔로워',eng:'참여율',cvr:'전환율',roas:'예상 ROAS',gmv:'예상 매출'};

function filterCreators(){
  const f=S.cr;
  let r=DB.creators.filter(c=>{
    if(f.q){const q=f.q.toLowerCase();
      if(!(c.handle.toLowerCase().includes(q)||c.name.toLowerCase().includes(q)||c.cat.includes(f.q)||c.sub.includes(f.q)))return false;}
    if(f.country!=='ALL'&&!(c.countries[f.country]>0))return false;
    if(f.cat!=='ALL'&&c.cat!==f.cat)return false;
    if(f.tier.length){const min=Math.min(...f.tier.map(t=>TIERS.find(x=>x[0]===t)[2]));if(c.followers<min)return false;}
    if(c.cvr<f.cvrMin)return false;
    if(c.roas<f.roasMin)return false;
    if(f.ch.length&&!f.ch.some(x=>c.channels.includes(x)))return false;
    if(f.eng==='high'&&c.eng<4.5)return false;
    if(f.eng==='mid'&&(c.eng<2.5||c.eng>=4.5))return false;
    if(f.eng==='low'&&c.eng>=2.5)return false;
    return true;
  });
  const k=f.sort;
  r.sort((a,b)=>(a[k]-b[k])*f.dir);
  return r;
}
function engLabel(v){return v>=4.5?['우수',SER_INK[1]]:v>=2.5?['보통',SER_INK[0]]:['낮음','var(--tx-3)'];}
function fitChip(v){return v>=95?['최적 매칭','c-green']:v>=90?['매우 적합','c-green']:v>=80?['적합','c-blue']:v>=65?['보통','c-gray']:['검토 필요','c-warn'];}

function pagerBtns(cur,total){
  const out=[];const add=p=>out.push(`<button class="pg-b ${p===cur?'on':''}" data-pg="${p}">${p}</button>`);
  if(total<=7){for(let i=1;i<=total;i++)add(i);}
  else{add(1);
    if(cur>3)out.push('<span class="pg-b" style="cursor:default">…</span>');
    for(let i=Math.max(2,cur-1);i<=Math.min(total-1,cur+1);i++)add(i);
    if(cur<total-2)out.push('<span class="pg-b" style="cursor:default">…</span>');
    add(total);}
  return out.join('');
}

  $$('#main [data-cat]').forEach(b=>b.onclick=()=>{f.cat=(f.cat===b.dataset.cat?'ALL':b.dataset.cat);f.page=1;re();});

    const k=b.dataset.tier;f.tier=b.checked?[...f.tier,k]:f.tier.filter(x=>x!==k);f.page=1;re();});
  $$('#main [data-ch]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.ch;f.ch=f.ch.includes(k)?f.ch.filter(x=>x!==k):[...f.ch,k];f.page=1;re();});
  on('#fCvr','input',e=>{f.cvrMin=+e.target.value;f.page=1;re();});
  on('#fRoas','input',e=>{f.roasMin=+e.target.value;f.page=1;re();});
  const q=$('#fQ'); if(q){q.oninput=()=>{f.q=q.value;f.page=1;re();
      const n=$('#fQ');if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length);}};}
  $$('#main [data-sort]').forEach(t=>t.onclick=()=>{
    const k=t.dataset.sort; if(f.sort===k)f.dir*=-1; else {f.sort=k;f.dir=-1;} re();});

  $$('#main [data-rmf]').forEach(b=>b.onclick=()=>{
    const v=b.dataset.rmf;
    if(v==='country')f.country='ALL'; else if(v==='cat')f.cat='ALL';
    else if(v==='cvrMin')f.cvrMin=0; else if(v==='roasMin')f.roasMin=0;
    else if(v==='eng')f.eng='ALL'; else if(v==='q')f.q='';
    else if(v.startsWith('tier:'))f.tier=f.tier.filter(x=>x!==v.slice(5));
    else if(v.startsWith('ch:'))f.ch=f.ch.filter(x=>x!==v.slice(3));
    f.page=1;re();});
  ['#crReset','#crReset2','#crReset3'].forEach(id=>on(id,'click',()=>{
    Object.assign(f,{q:'',country:'ALL',cat:'ALL',tier:[],cvrMin:0,roasMin:0,ch:[],eng:'ALL',page:1});
    re();toast('필터를 초기화했어요.','info');}));
  on('#crSearch','click',()=>{re();toast(`${filterCreators().length}명의 크리에이터를 찾았어요.`);});
  on('#crXls','click',()=>toast('검색 결과 '+filterCreators().length+'건을 엑셀로 내려받는 중이에요.','info'));
  on('#crAddFav','click',()=>{filterCreators().slice(0,5).forEach(c=>DB.fav.add(c.id));renderSide();re();
    toast('상위 5명을 관심 리스트에 담았어요.');});
  on('#cmpAdd','click',()=>toast('비교함에 담았어요. 최대 4명까지 비교할 수 있어요.','info'));
  $$('#main [data-propose]').forEach(b=>b.onclick=()=>proposeModal(b.dataset.propose));
}

function calendarHtml(y,m){
  const first=new Date(y,m-1,1), start=first.getDay(), days=new Date(y,m,0).getDate();
  const evs={5:[SER[0]],12:[SER[0],SER[1]],18:[SER[3]],19:[SER[1]],21:[SER[2]],26:[SER[3]],29:[SER[3]],8:[SER[1]]};
  let cells='';
  for(let i=0;i<start;i++)cells+=`<div class="cal-d mute"></div>`;
  for(let d=1;d<=days;d++){
    const on=d===20, rg=d>=12&&d<=26&&!on;
    cells+=`<div class="cal-d ${on?'on':rg?'rng':''}" data-cal="${d}">${d}
      ${evs[d]?`<span class="evs">${evs[d].map(c=>`<span class="ev" style="background:${c}"></span>`).join('')}</span>`:''}</div>`;
  }
  return `<div style="display:flex;align-items:center;gap:6px;margin-bottom:8px">
      <button class="ico-btn" style="width:24px;height:24px">${ic('chevL',13)}</button>
      <span style="font-size:12px;font-weight:800">${y}년 ${m}월</span>
      <button class="ico-btn" style="width:24px;height:24px">${ic('chevR',13)}</button>
      <div class="sp" style="flex:1"></div><button class="btn sm">오늘</button></div>
    <div class="calendar">${['일','월','화','수','목','금','토'].map(d=>`<div class="cal-h">${d}</div>`).join('')}${cells}</div>`;
}

function bindKanban(){
  let dragId=null;
  $$('#main [data-kbcard]').forEach(card=>{
    card.addEventListener('dragstart',()=>{dragId=card.dataset.kbcard;card.classList.add('drag');});
    card.addEventListener('dragend',()=>{card.classList.remove('drag');});
    card.addEventListener('click',()=>contentModal(card.dataset.kbcard));
  });
  $$('#main [data-kbcol]').forEach(col=>{
    col.addEventListener('dragover',e=>{e.preventDefault();col.classList.add('over');});
    col.addEventListener('dragleave',()=>col.classList.remove('over'));
    col.addEventListener('drop',e=>{e.preventDefault();col.classList.remove('over');
      const item=DB.contents.find(c=>c.id===dragId); if(!item)return;
      const to=col.dataset.kbcol; if(item.status===to)return;
      item.status=to; renderSide(); renderMain();
      toast(`"${item.title}"을(를) ${to}(으)로 옮겼어요.`);});
  });
}

function flyWheel(){
  const nodes=[['학습','(데이터 축적)',-90],['콘텐츠','(생성 & 최적화)',-18],['노출','(타겟 전달)',54],

  return `<div class="wheel">
    <div class="wheel-c">데이터<br>플라이휠</div>
    ${nodes.map(([t,s,ang],i)=>{
      const r=92, x=125+Math.cos(ang*Math.PI/180)*r-33, y=125+Math.sin(ang*Math.PI/180)*r-33;
      return `<div class="wheel-n" style="left:${x}px;top:${y}px" data-wheel="${i}">
        <div><div class="t">${t}</div><div class="s">${s}</div></div></div>`;}).join('')}
    <svg style="position:absolute;inset:0;pointer-events:none" width="250" height="250">
      <circle cx="125" cy="125" r="92" fill="none" stroke="rgba(59,130,246,.28)" stroke-width="1.5" stroke-dasharray="4 5"/>
    </svg></div>`;
}

  'data.sources':()=>scrPlaceholder('데이터 소스','연동된 데이터 소스와 수집 상태를 관리합니다.','db',
    ['채널·커머스·광고 계정 연동 상태','수집 지연 및 실패 알림','소스별 데이터 신선도(freshness) 표시']),
  'data.events':()=>scrPlaceholder('이벤트 & 추적','전환 이벤트 정의와 어트리뷰션을 관리합니다.','target',
    ['전환 이벤트 정의 및 중복 제거','어트리뷰션 모델 선택 (라스트클릭 / 기여도 분배)','크리에이터 코드·딥링크 매핑']),
  'data.quality':()=>scrPlaceholder('데이터 품질','학습 데이터의 신뢰도를 검증합니다.','shield',
    ['누락·이상치 탐지 리포트','채널 간 매출 정합성 검증','모델 학습 제외 데이터 규칙']),
  'set.overview':scrSetOverview, 'set.tax':scrSetTax,
  'set.detail':()=>scrPlaceholder('정산 내역','건별 정산 이력과 증빙을 조회합니다.','file',
    ['건별 정산 명세서 및 증빙 다운로드','환율 적용 시점·수수료 내역','정산 이의 제기 및 처리 이력']),
  'cfg.general':()=>scrPlaceholder('일반 설정','브랜드 계정과 기본 정책을 설정합니다.','gear',
    ['브랜드 프로필 · 가이드라인 문서','기본 SLA 및 승인 단계 정의','통화·시간대·언어 기본값']),
  'cfg.members':()=>scrPlaceholder('멤버 & 권한','팀 멤버와 역할 권한을 관리합니다.','users',
    ['역할 정의 (브랜드 관리자 / 마케터 / 검수자 / 뷰어)','국가·캠페인 단위 접근 권한','정산 승인 권한 분리']),
  'cfg.channels':()=>scrPlaceholder('연동 채널','판매·광고 채널 연동을 관리합니다.','globe',
    ['채널별 OAuth 연동 및 토큰 만료 알림','채널별 수집 지표 매핑','신규 채널 추가 요청'])
};
function renderMain(){
  const fn=ROUTES[S.route]||(()=>scrPlaceholder('준비 중','','layers'));
  $('#main').innerHTML=fn();
  bindCommon();
  if(S.route==='inf.discover'||S.route==='inf.search')bindInfDiscover();
  if(S.route==='cmp.approval')bindKanban();
  bindPage();
}
function bindPage(){
  const on=(sel,fn)=>$$(sel).forEach(n=>n.onclick=fn);
  // 라인차트 바인딩
  bindLine('dashLine',wonM,'매출');
  bindLine('cmpLine',v=>wonM(v*1000000),'일 매출');
  bindLine('cmpLine2',v=>Math.round(v).toLocaleString()+'건','일 주문 수');
  bindLine('rep1',v=>v.toFixed(1)+'%','재구매율');
  bindLine('rep2',v=>v.toFixed(1)+'K','누적 고객 수');
  bindLine('aiAcc',v=>v+'%','적중률');
  // 공통 버튼
  on('#btnNewCmp,#btnNewCmp2,#btnNewCmp3',openWizard);
  on('#btnExport,#dlReport,#dlReport2,#setXls,#cmpReport',()=>toast('리포트를 생성하고 있어요. 완료되면 알려드릴게요.','info'));
  on('#openNotif2',openNotifs);
  on('#cmpDup',()=>toast('캠페인을 복제했어요. 기획 단계로 생성됩니다.'));
  on('#cmpTpl',()=>toast('캠페인 템플릿 6종을 불러왔어요.','info'));
  on('#cmpOptimize',()=>{go('data.copilot');toast('AI 최적화 제안 6건을 찾았어요.');});
  on('#dFilter',()=>toast('필터 패널은 상단 조건 영역에서 조정할 수 있어요.','info'));
  on('#genTopFmt,#genTopFmt2',()=>{go('con.studio');toast('전환율 1위 포맷으로 생성 조건을 세팅했어요.');});
  on('#genRun',()=>toast('콘텐츠 8건을 생성했어요. 승인 워크플로로 전송됩니다.'));
  on('#applyBudget,#applyBudget2,#applyAll',()=>toast('예산 재배분을 승인 대기열에 등록했어요.'));
  on('#autoRules',()=>toast('자동화 규칙은 우측 패널에서 켜고 끌 수 있어요.','info'));
  on('#apRemind,#docRemind,#docRemind2',()=>toast('지연 건 담당자에게 리마인드를 발송했어요.'));
  on('#apBulk',()=>toast('선택한 콘텐츠를 일괄 승인했어요.'));
  on('#setRun',()=>toast('정산을 실행했어요. 22건 · ₩860,420,000'));
  on('#assetMgr',()=>toast('에셋 라이브러리를 여는 중이에요.','info'));
  on('#addProd,#addMarket',()=>toast('등록 플로우는 프로토타입 범위 밖이에요.','warn'));
  on('#mkRetention',()=>{openWizard();toast('1→2회 전환 캠페인 템플릿을 불러왔어요.');});
  on('#btnLang',()=>toast('언어를 전환할 수 있어요. (한국어 / English / 日本語)','info'));
  on('#btnUser',()=>toast('브랜드 계정 전환·설정 메뉴가 열립니다.','info'));
  // 데이터 화면 토글
  $$('[data-cm]').forEach(b=>b.onclick=()=>{S.data.countryMetric=b.dataset.cm;renderMain();});
  $$('[data-chm]').forEach(b=>b.onclick=()=>{S.data.channelMetric=b.dataset.chm;renderMain();});
  $$('[data-rv]').forEach(b=>b.onclick=()=>{S.data.repeatView=b.dataset.rv;renderMain();
    toast(`재구매 추이를 ${b.dataset.rv} 단위로 봅니다.`,'info');});
  const fm=$('#fmtMetric'); if(fm)fm.onchange=()=>{S.data.fmtMetric=fm.value;renderMain();};
  $$('[data-ctf]').forEach(b=>b.onclick=()=>{S.cmp.ctFilter=b.dataset.ctf;renderMain();});
  $$('[data-ctrow]').forEach(b=>b.onclick=()=>contentModal(b.dataset.ctrow));
  $$('[data-cmpsel]').forEach(b=>b.onclick=()=>{S.cmp.id=b.dataset.cmpsel;
    if(S.route==='cmp.list'){renderMain();toast(DB.campaigns.find(c=>c.id===b.dataset.cmpsel).name+' 선택됨','info');}
    else go('cmp.detail');});
  const cs=$('#cmpSwitch'); if(cs)cs.onchange=()=>{S.cmp.id=cs.value;renderMain();};
  $$('[data-stage]').forEach(b=>b.onclick=()=>{S.collab.stage=b.dataset.stage;renderMain();});
  $$('[data-setst]').forEach(b=>b.onclick=()=>{S.settle.status=b.dataset.setst;renderMain();});
  $$('[data-country]').forEach(b=>b.onclick=()=>{const c=DB.countries.find(x=>x.code===b.dataset.country);
    toast(`${c.name} · 매출 ${won(c.rev)} · ROAS ${c.roas}`,'info');});
  $$('[data-aiact]').forEach(b=>b.onclick=()=>{const i=DB.aiActions.findIndex(a=>a.id===b.dataset.aiact);
    const a=DB.aiActions[i];DB.aiActions.splice(i,1);renderSide();renderMain();
    toast(`"${a.t}" 적용했어요. ${a.impact}`);});
  $$('[data-aidismiss]').forEach(b=>b.onclick=()=>{const i=DB.aiActions.findIndex(a=>a.id===b.dataset.aiact||a.id===b.dataset.aidismiss);
    DB.aiActions.splice(i,1);renderSide();renderMain();toast('액션을 보류했어요.','info');});
  $$('[data-wheel]').forEach(b=>b.onclick=()=>{
    const info=[['학습','주문·행동·크리에이터·고객 데이터를 매일 새벽 2시에 학습합니다. 누적 8.7TB.'],
      ['콘텐츠','학습 결과로 전환율 높은 포맷·후킹 문구를 생성합니다. 이번 달 1,342건.'],
      ['노출','고전환 오디언스를 우선 타겟팅합니다. 유사 오디언스 자동 확장.'],
      ['클릭','썸네일·첫 3초 이탈률을 학습해 소재를 자동 교체합니다.'],
      ['전환','구매 데이터가 다시 학습 인풋으로 들어가 매칭 정확도를 높입니다.'],
      ['재구매','재구매 주기를 예측해 리마인드 시점과 크리에이터를 추천합니다.']][+b.dataset.wheel];
    $$('[data-wheel]').forEach(x=>x.classList.remove('on')); b.classList.add('on');
    const d=$('#wheelDetail'); if(d)d.innerHTML=`<b style="color:var(--pri-2)">${info[0]}</b> — ${info[1]}`;
    else toast(`${info[0]}: ${info[1]}`,'info');});
  $$('[data-genfmt]').forEach(b=>b.onclick=()=>{go('con.studio');toast(`"${b.dataset.genfmt}" 포맷으로 생성 조건을 세팅했어요.`);});
  $$('[data-genitem]').forEach(b=>b.onclick=()=>toast('생성된 콘텐츠 상세 미리보기를 엽니다.','info'));
  $$('[data-asset]').forEach(b=>b.onclick=()=>toast(`${b.dataset.asset} 에셋을 엽니다.`,'info'));
  $$('[data-resolve]').forEach(b=>b.onclick=()=>toast(`${b.dataset.resolve} 일정을 조정했어요.`));
  $$('[data-cal]').forEach(b=>b.onclick=()=>{$$('[data-cal]').forEach(x=>x.classList.remove('on'));b.classList.add('on');
    toast(`8월 ${b.dataset.cal}일 일정을 봅니다.`,'info');});
  const fb=$('#favBulk'); if(fb)fb.onclick=()=>toast(`관심 리스트 ${DB.fav.size}명에게 일괄 제안을 발송했어요.`);
  const fx=$('#favXls'); if(fx)fx.onclick=()=>toast('관심 리스트를 엑셀로 내려받는 중이에요.','info');
}

/* =========================================================================
   [11] 기획 노트 패널 + 부팅
   ========================================================================= */
const PLAN_SUMMARY=[
  ['진단 1 · 화면이 "보여주기"에서 끝난다','대시보드·분석 화면 대부분이 숫자를 나열하고 끝납니다. 다음 행동(예산 이동, 크리에이터 교체, 콘텐츠 재생산)으로 이어지는 경로가 없습니다.'],
  ['진단 2 · 병목이 보이지 않는다','승인 단계 숫자는 있지만 누가·무엇 때문에 막혔는지 없습니다. SLA·담당자·리드타임을 노출하는 칸반형 워크플로를 신설했습니다.'],
  ['진단 3 · 매칭 근거가 없다','적합도 98점의 근거와 리스크(팔로워 품질, 경쟁사 협업)가 없어 신뢰할 수 없습니다. 근거 분해 + 리스크 체크를 추가했습니다.'],
  ['진단 4 · 재구매를 전체 합계로만 본다','인플루언서 커머스의 핵심 지표는 LTV입니다. 코호트·크리에이터별 재구매 기여로 분리했습니다.'],
  ['진단 5 · 정산이 금액만 보여준다','실제 정산 실패는 서류·세무·송금에서 발생합니다. 실행 전 리스크 배너를 넣었습니다.'],
  ['진단 6 · 차트 문법 오류','재구매 추이가 %와 명(名)을 한 차트 두 축에 겹칩니다. 소형 배수 차트로 분리했습니다.']
];
function openPlanPanel(){
  drawer(`<div class="drw-hd">${ic('book',18)}<div style="flex:1">
      <div style="font-size:14px;font-weight:800">서비스 기획 고도화 노트</div>
      <div style="font-size:11px;color:var(--tx-3)">화면 안 파란/초록 박스로도 표시됩니다</div></div>
      <button class="x-btn" onclick="closeDrawer()">${ic('x',16)}</button></div>
    <div class="drw-bd">
      <div style="display:flex;align-items:center;gap:9px;padding:11px;border-radius:10px;border:1px solid var(--line-2);
        background:rgba(255,255,255,.02);margin-bottom:14px">
        <div style="flex:1"><div style="font-size:12px;font-weight:800">화면 내 기획 노트 표시</div>
          <div style="font-size:10.5px;color:var(--tx-3)">끄면 순수 UI만 보입니다</div></div>
        <input type="checkbox" id="noteTgl" ${S.notes?'checked':''} style="width:36px;height:20px;accent-color:var(--pri);cursor:pointer"></div>
      ${PLAN_SUMMARY.map(([t,b])=>`<div style="padding:11px;border-radius:10px;border:1px solid var(--line);
        background:rgba(10,17,32,.5);margin-bottom:9px">
        <div style="font-size:12px;font-weight:800;color:var(--pri-2);margin-bottom:5px">${t}</div>
        <div style="font-size:11.5px;color:var(--tx-1);line-height:1.6">${b}</div></div>`).join('')}
      <div style="font-size:11.5px;font-weight:800;color:var(--tx-2);margin:16px 0 8px">신규 제안 화면 바로가기</div>
      ${[['data.copilot','추천 & 자동화 인사이트','데이터를 액션 큐로 전환'],
         ['cmp.approval','승인 워크플로 (칸반)','검수 병목 가시화 + AI 사전검수'],
         ['data.cohort','고객 & 재구매 분석','LTV/CAC · 코호트 리텐션'],
         ['set.overview','정산 현황','정산 실패 원인 사전 감지'],
         ['inf.collab','협업 관리','섭외 6단계 파이프라인'],
         ['data.channel','채널 × 국가 히트맵','예산 재배분 의사결정 단위']].map(([r,t,d])=>
        `<button class="flow-r" style="width:100%" data-go="${r}" onclick="closeDrawer()">
          <span class="flow-ic" style="background:var(--acc-dim);color:var(--acc)">${ic('spark',14)}</span>
          <div style="flex:1;text-align:left"><div class="t">${t}</div><div class="s">${d}</div></div>${ic('chevR',13)}</button>`).join('')}
    </div>
    <div class="drw-ft"><button class="btn" style="width:100%;justify-content:center" onclick="closeDrawer()">닫기</button></div>`);
  $('#noteTgl').onchange=e=>{S.notes=e.target.checked;renderMain();
    toast(S.notes?'기획 노트를 표시합니다.':'기획 노트를 숨겼습니다.','info');};
}

/* ---------- BOOT ---------- */
renderGnb(); renderSide(); renderMain();
document.addEventListener('click',e=>{
  if(e.target.closest('#btnBell'))openNotifs();
  if(e.target.closest('#btnCopilot')||e.target.closest('#sdCopilot'))openCopilot();
  if(e.target.closest('#demoFab'))openPlanPanel();
});
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openCopilot();}
});
setTimeout(()=>toast('클릭 가능한 프로토타입이에요. 좌측 하단 "기획 노트 보기"에서 개선 포인트를 확인하세요.','info'),700);
</script>
